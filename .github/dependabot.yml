# The "chore(deps)" prefix makes Dependabot titles pass the Conventional
# Commits check in pull-request.yml, e.g.
# "chore(deps): bump the go-deps group with 2 updates".
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]
