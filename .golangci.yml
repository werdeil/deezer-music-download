version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - misspell
    - unconvert

formatters:
  enable:
    - gofmt

issues:
  # Report every finding (the defaults hide all but 3 of each kind).
  max-issues-per-linter: 0
  max-same-issues: 0
